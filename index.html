     START: SECTION 1 — HTML
     ============================ -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matthew Portfolio Adventure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Link to CSS -->
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- World overlay -->
<div id="world-overlay">
    <div id="world-title"></div>
    <div id="world-exit-hint">Press ESC to exit</div>
</div>

<!-- Intro overlay -->
<div id="matthew-portfolio-intro">
    <div class="mpi-center">
        <div class="mpi-title">
            M
            <span class="mpi-triangle-wrapper">
                <span class="mpi-triangle-letter"></span>
            </span>
            <span class="mpi-rest">THEW</span>
        </div>
        <div class="mpi-surname">WOLSTENCROFT</div>
        <div class="mpi-portfolio">PORTFOLIO</div>
        <div class="mpi-sub">CLICK TRIANGLE TO START</div>
    </div>
</div>

<!-- Player + markers -->
<div id="player-dot"></div>
<div class="vertex-marker" id="marker-top"></div>
<div class="vertex-marker" id="marker-left"></div>
<div class="vertex-marker" id="marker-right"></div>

<!-- Corners -->
<div class="corner" id="corner-top"></div>
<div class="corner" id="corner-left"></div>
<div class="corner" id="corner-right"></div>

<!-- WASD tutorial -->
<div id="wasd-tutorial">
    <div class="wasd-row">
        <div class="wasd-btn" id="btn-w">W</div>
    </div>
    <div class="wasd-row">
        <div class="wasd-btn" id="btn-a">A</div>
        <div class="wasd-btn" id="btn-s">S</div>
        <div class="wasd-btn" id="btn-d">D</div>
    </div>
</div>

<!-- Labels container -->
<div id="labels"></div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>

<!-- ============================
     END: SECTION 1 — HTML
     ============================ -->
