<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Void Portfolio Prototype v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    transition: background 0.5s ease;
  }

  /* PLAYER */
  #player {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  /* WORLD BUTTONS */
  .world-button {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .world-button:hover { transform: scale(1.2); }

  .world-button[data-world="ux"] { background: #3b82f6; left: 25%; top: 45%; }
  .world-button[data-world="illustration"] { background: #ef4444; left: 50%; top: 30%; }
  .world-button[data-world="web"] { background: #22c55e; left: 75%; top: 45%; }

  /* BACK BUTTON */
  #backButton {
    position: absolute;
    width: 22px;
    height: 22px;
    background: #fff;
    top: 20px;
    left: 20px;
    cursor: pointer;
    display: none;
  }

  /* INFO PANEL */
  #infoPanel {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 16px;
    background: rgba(0,0,0,0.85);
    border: 1px solid #fff;
    color: #fff;
    font-size: 14px;
    display: none;
    max-width: 80vw;
  }

  /* FLOATING INFO BUTTONS */
  .info-button {
    position: absolute;
    padding: 6px 10px;
    border: 1px solid #fff;
    background: rgba(0,0,0,0.6);
    font-size: 12px;
    cursor: pointer;
    animation: drift 6s infinite ease-in-out alternate;
  }

  @keyframes drift {
    from { transform: translateY(-5px); }
    to { transform: translateY(5px); }
  }

  /* WORLD STYLES */
  .world-void { background: #000; }

  .world-ux {
    background: #020617;
    background-image:
      linear-gradient(#1f2937 1px, transparent 1px),
      linear-gradient(90deg, #1f2937 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .world-illustration {
    background: #111827;
  }
  .world-illustration::before {
    content: "";
    position: absolute;
    inset: 10%;
    border: 2px solid #f97316;
    pointer-events: none;
  }

  .world-web {
    background: #020617;
    background-image:
      linear-gradient(#0f172a 2px, transparent 2px),
      linear-gradient(90deg, #0f172a 2px, transparent 2px);
    background-size: 20px 20px;
  }

  /* WORLD LABEL */
  #worldLabel {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 4px 8px;
    border: 1px solid #fff;
    background: rgba(0,0,0,0.6);
    font-size: 12px;
  }
</style>
</head>
<body>

<div id="game" class="world-void">
  <div id="player"></div>

  <!-- VOID BUTTONS -->
  <div class="world-button" data-world="ux"></div>
  <div class="world-button" data-world="illustration"></div>
  <div class="world-button" data-world="web"></div>

  <div id="backButton"></div>
  <div id="infoPanel"></div>
  <div id="worldLabel">World: VOID</div>
</div>

<script>
/* BASIC SETUP */
const game = document.getElementById("game");
const player = document.getElementById("player");
const backButton = document.getElementById("backButton");
const infoPanel = document.getElementById("infoPanel");
const worldLabel = document.getElementById("worldLabel");
const worldButtons = [...document.querySelectorAll(".world-button")];

let world = "void";
let px = window.innerWidth / 2;
let py = window.innerHeight / 2;
const speed = 3;

const keys = { ArrowUp:0, ArrowDown:0, ArrowLeft:0, ArrowRight:0, w:0, a:0, s:0, d:0 };

/* WORLD SWITCHING */
function setWorld(w) {
  world = w;
  game.className = "world-" + w;
  worldLabel.textContent = "World: " + w.toUpperCase();

  infoPanel.style.display = "none";
  infoPanel.textContent = "";

  if (w === "void") {
    backButton.style.display = "none";
    worldButtons.forEach(b => b.style.display = "block");
    document.querySelectorAll(".info-button").forEach(el => el.remove());
  } else {
    backButton.style.display = "block";
    worldButtons.forEach(b => b.style.display = "none");
    createInfoButtons(w);
  }
}

/* INFO BUTTONS PER WORLD */
function createInfoButtons(w) {
  document.querySelectorAll(".info-button").forEach(el => el.remove());

  const data = {
    ux: [
      { x: 20, y: 40, label: "Case Studies", text: "UX/UI case studies, flows, wireframes, prototypes." },
      { x: 60, y: 50, label: "Wireframes", text: "Low-fidelity wireframes showing structure." },
      { x: 40, y: 65, label: "Process", text: "Research → Ideation → Testing → Iteration." }
    ],
    illustration: [
      { x: 25, y: 45, label: "Final Art", text: "Selected illustrations showing your style." },
      { x: 55, y: 35, label: "Sketches", text: "Rough sketches behind the final pieces." },
      { x: 70, y: 60, label: "Concepts", text: "Character and world concept explorations." }
    ],
    web: [
      { x: 30, y: 40, label: "Web Projects", text: "Live or demo web projects." },
      { x: 65, y: 50, label: "Components", text: "Reusable UI components." },
      { x: 50, y: 65, label: "Code & Design", text: "How design meets front-end." }
    ]
  };

  data[w].forEach(btn => {
    const el = document.createElement("div");
    el.className = "info-button";
    el.style.left = btn.x + "vw";
    el.style.top = btn.y + "vh";
    el.textContent = btn.label;
    el.dataset.text = btn.text;
    game.appendChild(el);
  });
}

/* COLLISION CHECK */
function overlap(r1, r2) {
  return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
}

/* MOVEMENT LOOP */
function update() {
  let dx = 0, dy = 0;
  if (keys.ArrowUp || keys.w) dy -= 1;
  if (keys.ArrowDown || keys.s) dy += 1;
  if (keys.ArrowLeft || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    px += dx * speed;
    py += dy * speed;
  }

  px = Math.max(10, Math.min(window.innerWidth - 10, px));
  py = Math.max(10, Math.min(window.innerHeight - 10, py));

  player.style.left = px + "px";
  player.style.top = py + "px";

  checkCollisions();
  requestAnimationFrame(update);
}

/* COLLISION LOGIC */
function checkCollisions() {
  const pr = player.getBoundingClientRect();

  if (world === "void") {
    for (const b of worldButtons) {
      if (overlap(pr, b.getBoundingClientRect())) {
        setWorld(b.dataset.world);
        return;
      }
    }
  } else {
    if (overlap(pr, backButton.getBoundingClientRect())) {
      setWorld("void");
      return;
    }

    let hit = false;
    document.querySelectorAll(".info-button").forEach(btn => {
      if (overlap(pr, btn.getBoundingClientRect())) {
        infoPanel.textContent = btn.dataset.text;
        infoPanel.style.display = "block";
        hit = true;
      }
    });

    if (!hit) infoPanel.style.display = "none";
  }
}

/* INPUT */
window.addEventListener("keydown", e => { if (e.key in keys) keys[e.key] = 1; });
window.addEventListener("keyup", e => { if (e.key in keys) keys[e.key] = 0; });

/* START */
setWorld("void");
update();
</script>

</body>
</html>
