<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matthew Wolstencroft Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="matthew-portfolio-intro">
    <div class="mpi-center">
      <div class="mpi-title">
        M
        <span class="mpi-triangle-wrapper">
          <span class="mpi-triangle-letter"></span>
        </span>
        <span class="mpi-rest">TTHEW</span>
      </div>

      <div class="mpi-surname">WOLSTENCROFT</div>
      <div class="mpi-portfolio">PORTFOLIO</div>
      <div class="mpi-sub">CLICK TRIANGLE TO START</div>
    </div>
  </div>

  <!-- Player + portals -->
  <div id="player-dot"></div>
  <div id="portal-top" class="portal"></div>
  <div id="portal-left" class="portal"></div>
  <div id="portal-right" class="portal"></div>

  <!-- WASD tutorial -->
  <div id="wasd-tutorial">
    <div class="key">W</div>
    <div class="key-row">
      <div class="key">A</div>
      <div class="key">S</div>
      <div class="key">D</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
