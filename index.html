<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matthew Portfolio Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin: 0; padding: 0; background: #050509; overflow: hidden; }
canvas { image-rendering: pixelated; }
</style>
</head>
<body>

<script>
/* -----------------------------------------------------------
   INTRO OVERLAY (your original intro, unchanged)
----------------------------------------------------------- */
(() => {
    const old = document.getElementById('matthew-portfolio-intro');
    if (old) old.remove();

    const overlay = document.createElement('div');
    overlay.id = 'matthew-portfolio-intro';
    overlay.innerHTML = `
        <div class="mpi-center">
            <div class="mpi-title">
                M
                <span class="mpi-triangle-wrapper">
                    <span class="mpi-triangle-letter"></span>
                </span>
                <span class="mpi-rest">TTHEW</span>
            </div>
            <div class="mpi-surname">WOLSTENCROFT</div>
            <div class="mpi-portfolio">PORTFOLIO</div>
            <div class="mpi-sub">CLICK TRIANGLE TO START</div>
        </div>
    `;
    document.body.appendChild(overlay);

    const style = document.createElement('style');
    style.textContent = `
        #matthew-portfolio-intro {
            position: fixed; inset: 0; background: #050509; color: #fff;
            font-family: system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center;
            z-index: 999999; text-align: center;
        }
        .mpi-center { display: flex; flex-direction: column; align-items: center; transform: translateY(80px); }
        .mpi-title { font-size: 60px; letter-spacing: 0.12em; margin-bottom: 10px; position: relative; }
        .mpi-triangle-wrapper { display: inline-block; width: 16px; height: 40px; position: relative; }
        .mpi-triangle-letter {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 0; height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 36px solid #ffffff;
            cursor: pointer;
            animation: bob 1.2s ease-in-out infinite;
        }
        @keyframes bob {
            0% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-10px); }
            100% { transform: translate(-50%, -50%) translateY(0); }
        }
        #player-dot {
            position: fixed; width: 22px; height: 22px; border-radius: 50%;
            background: black; display: none; z-index: 999999999;
        }
        .corner {
            position: fixed; width: 0; height: 0; display: none;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 36px solid #2f7dff;
            opacity: 0; transition: opacity 2s ease-out;
        }
        #corner-left { transform: rotate(121deg); border-bottom-color: #ff4040; }
        #corner-right { transform: rotate(239deg); border-bottom-color: #00c853; }
        .triangle-label {
            position: fixed; font-size: 16px; font-weight: 600;
            pointer-events: none; text-transform: uppercase;
        }
    `;
    document.head.appendChild(style);

    /* -----------------------------------------------------------
       GAME VARIABLES
    ----------------------------------------------------------- */
    const triangle = overlay.querySelector('.mpi-triangle-letter');
    const player = document.createElement('div');
    player.id = 'player-dot';
    document.body.appendChild(player);

    const cornerTop = document.createElement('div');
    cornerTop.id = 'corner-top';
    cornerTop.className = 'corner';

    const cornerLeft = document.createElement('div');
    cornerLeft.id = 'corner-left';
    cornerLeft.className = 'corner';

    const cornerRight = document.createElement('div');
    cornerRight.id = 'corner-right';
    cornerRight.className = 'corner';

    document.body.appendChild(cornerTop);
    document.body.appendChild(cornerLeft);
    document.body.appendChild(cornerRight);

    let px = 0, py = 0;
    const speed = 3;
    const keys = { w: false, a: false, s: false, d: false };

    /* -----------------------------------------------------------
       WORLD LOADER
    ----------------------------------------------------------- */
    function loadWorld(name) {
        document.body.innerHTML = ""; // wipe intro
        startWorld(name);
    }

    function startWorld(name) {
        const canvas = document.createElement("canvas");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        document.body.appendChild(canvas);

        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        if (name === "uxui") worldUXUI(ctx);
        if (name === "illustration") worldIllustration(ctx);
        if (name === "webdesign") worldWeb(ctx);
    }

    /* -----------------------------------------------------------
       WORLD DEFINITIONS
    ----------------------------------------------------------- */

    function worldUXUI(ctx) {
        function draw() {
            ctx.fillStyle = "#0d1b2a";
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            ctx.fillStyle = "#2f7dff";
            ctx.fillRect(100, 100, 120, 80);

            requestAnimationFrame(draw);
        }
        draw();
    }

    function worldIllustration(ctx) {
        function draw() {
            ctx.fillStyle = "#200";
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            ctx.fillStyle = "#ff4040";
            ctx.fillRect(150, 150, 80, 80);

            requestAnimationFrame(draw);
        }
        draw();
    }

    function worldWeb(ctx) {
        function draw() {
            ctx.fillStyle = "#001f0a";
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            ctx.fillStyle = "#00c853";
            ctx.fillRect(200, 120, 140, 60);

            requestAnimationFrame(draw);
        }
        draw();
    }

    /* -----------------------------------------------------------
       TRIANGLE CLICK → START GAME
    ----------------------------------------------------------- */
    triangle.addEventListener('click', () => {
        triangle.style.animation = "none";

        const rect = triangle.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const topY = rect.top;
        const bottomY = rect.bottom;
        const halfW = rect.width / 2;

        px = cx - 11;
        py = (topY + bottomY) / 2 - 11;

        player.style.left = px + "px";
        player.style.top = py + "px";
        player.style.display = "block";

        cornerTop.style.left = (cx - 22) + "px";
        cornerTop.style.top = topY + "px";

        cornerLeft.style.left = (cx - halfW - 22) + "px";
        cornerLeft.style.top = bottomY + "px";

        cornerRight.style.left = (cx + halfW - 22) + "px";
        cornerRight.style.top = bottomY + "px";

        cornerTop.style.display = "block";
        cornerLeft.style.display = "block";
        cornerRight.style.display = "block";

        requestAnimationFrame(() => {
            cornerTop.style.opacity = 1;
            cornerLeft.style.opacity = 1;
            cornerRight.style.opacity = 1;
        });

        placeLabel("UX/UI DESIGN", "#2f7dff", cx, topY - 40);
        placeLabel("ILLUSTRATION", "#ff4040", cx - halfW - 80, bottomY - 20);
        placeLabel("WEB DESIGN", "#00c853", cx + halfW + 80, bottomY - 20);
    });

    function placeLabel(text, color, x, y) {
        const label = document.createElement('div');
        label.className = 'triangle-label';
        label.textContent = text;
        label.style.color = color;
        label.style.left = x + "px";
        label.style.top = y + "px";
        label.style.transform = "translate(-50%, -50%)";
        document.body.appendChild(label);
    }

    /* -----------------------------------------------------------
       MOVEMENT + WORLD ENTRY
    ----------------------------------------------------------- */
    document.addEventListener('keydown', e => { if (keys[e.key] !== undefined) keys[e.key] = true; });
    document.addEventListener('keyup', e => { if (keys[e.key] !== undefined) keys[e.key] = false; });

    function distance(x1, y1, x2, y2) {
        return Math.hypot(x2 - x1, y2 - y1);
    }

    function checkWorldEntry(px, py) {
        if (distance(px, py, cornerTop.offsetLeft, cornerTop.offsetTop) < 40)
            loadWorld("uxui");

        if (distance(px, py, cornerLeft.offsetLeft, cornerLeft.offsetTop) < 40)
            loadWorld("illustration");

        if (distance(px, py, cornerRight.offsetLeft, cornerRight.offsetTop) < 40)
            loadWorld("webdesign");
    }

    function gameLoop() {
        if (player.style.display === "block") {
            if (keys.w) py -= speed;
            if (keys.s) py += speed;
            if (keys.a) px -= speed;
            if (keys.d) px += speed;

            player.style.left = px + "px";
            player.style.top = py + "px";

            checkWorldEntry(px + 11, py + 11);
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
})();
</script>

</body>
</html>
